<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> 
<head>
	<meta charset="UTF-8">
	<title>Listagem de Usuários</title>
	<link href="style.css" rel="stylesheet">
</head>
<body>

	<div th:insert="~{parts/header :: header}"></div>

	<h2>Listagem de Usuários</h2>
	
	<div class="container content">
	
		<div th:insert="~{parts/flash :: flash}"></div> 
		
		<a th:href="@{/usuarios/create}" class="btn">Adicionar Usuário</a>
		
		<form method="GET" th:action="@{/usuarios}" class="search-form">
			<input type="text" name="search" id="search" placeholder="Pesquisar" th:value="${param.search}">
			<button type="submit">
				<svg width="16" height="16" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
				  <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
				</svg>
			</button>
		</form>
		<table>
			<tr>
				<th>Nome</th>
				<th>E-mail</th>
				<th>Ações</th>
			</tr>
			<tr th:each="usuario: ${usuariosPage.content}">
				<td th:text="${usuario.nome}"></td>
				<td th:text="${usuario.email}"></td>
				<td class="action">
					<a th:href="@{/usuarios/edit/{id}(id=${usuario.id})}">
						<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
						  <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
						</svg>
					</a>
					<a th:href="@{/usuarios/delete/{id}(id=${usuario.id})}" onclick="return confirm('Relamente deseja deletar')">
						<svg width="16" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
						  <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
						</svg>
					</a>
				</td>
			</tr>
			
		</table>
		
   		<ul class="paginate">
   			<li th:if="${usuariosPage.hasPrevious()} ">
   				<a 
   					th:href="@{/usuarios(page=${usuariosPage.previousPageable().pageNumber+1})}"
                  		class="page-item">&lsaquo;</a>
   			<li>
            	<li 
            		th:each="pageNum : ${#numbers.sequence(1, usuariosPage.totalPages)}">
                <a 
                	th:href="@{/usuarios(page=${pageNum}, search=${param.search})}"
                   	th:text="${pageNum}"
                   	th:class="${pageNum == usuariosPage.number+1 ? 'page-item active' : 'page-item'}">
                  	1
                 </a>
             </li>
             <li th:if="${usuariosPage.hasNext()} ">
   				<a 
   					th:href="@{/usuarios(page=${usuariosPage.nextPageable().pageNumber+1})}"
                  		class="page-item">&rsaquo;</a>
   			<li>
         </ul>
		
		
	</div>
</body>
</html>
