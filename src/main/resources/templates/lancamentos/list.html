<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
<head>
	<meta charset="UTF-8">
	<title>Listar Lançamentos</title>
	<link href="/style.css" rel="stylesheet" />
</head>
<body>

	<div th:insert="~{parts/header :: header}"></div>
	
	<h2>Listagem de Lançamentos</h2>
	
	
	
	<div class="container content">
	
		<div th:insert="~{parts/flash :: flash}"></div>
	
		<a th:href="@{/lancamentos/create}" class="btn">Adicionar Lançamento</a>
		
		<form th:action="@{/lancamentos}" method="GET" class="search-form">
			<select name="data">
				<option 
					th:each="mes: ${meses}" 
					th:value="${ #temporals.format(mes, 'yyyy-MM') + '-01'}" 
					th:text="${#temporals.format(mes, 'MMM/yyyy')}"
					th:selected="${param.data != null && param.data[0] == (#temporals.format(mes, 'yyyy-MM') + '-01')}"></option>
			</select>
			
			<button type="submit" class="btn">Listar</button>
		</form>
		
		<div class="saldo-container">
			<div class="saldo">
				<div class="caixa-titulo">Saldo</div>
				<div class="caixa-valor" th:text="${ #numbers.formatCurrency(saldo/100)}"></div>
			</div>
			
			<div  class="entrada">
				<div class="caixa-titulo">Total Entada Mês</div>
				<div class="caixa-valor" th:text="${ #numbers.formatCurrency( balanco['ENTRADA'] / 100 ) }"></div>
			</div>
			<div class="saida">
				<div class="caixa-titulo">Total Saída Mês:</div>
				<div class="caixa-valor" th:text="${ #numbers.formatCurrency( balanco['SAIDA'] / 100) }"></div>
			</div>
		</div>
		
		
		<table>
			<tr>
				<th>Data</th>
				<th>Descrição</th>
				<th>Entrada</th>
				<th>Saída</th>
				<th>Ações</th>
			</tr>
			
			<tr th:each="lancamento: ${lancamentos}">
				<td th:text="${ #temporals.format(lancamento.data, 'dd/MM/yyyy')}"></td>
				<td th:text="${ lancamento.descricao}"></td>
				<td th:text="${ lancamento.tipoLancamento == T(com.rodrigoaramburu.contas.models.TipoLancamento).ENTRADA ?   #numbers.formatCurrency(lancamento.valor.doubleValue() /100 ) : ''}"></td>
				<td th:text="${ lancamento.tipoLancamento == T(com.rodrigoaramburu.contas.models.TipoLancamento).SAIDA ?  #numbers.formatCurrency(lancamento.valor.doubleValue() /100 ) : ''}"></td>
				<td class="action">
					<a th:href="@{/lancamentos/{id}/delete(id=${lancamento.id})}">
						<svg width="16" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
						  <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
						</svg>
					
					</a>
				</td>
			</tr>
		</table>
	</div>


</body>
</html>
